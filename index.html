<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>OBMC Enroll</title>
</head>
<body>
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 32px 16px;
      background: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/affba656-d015-4b96-a8ba-3ef5bbbc2c39/OBMC+MONTESSORI+GH+-+AY+2026+FA.jpg) center / cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
    } 
        .form-box {
            width: 100%;
            max-width: 820-x;
            background-color: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(6px);
            padding:28px 32px;
            border-radius: 5px;
            box-shadow: 0 10px 30 px rgba(0, 0, 0, 0.18);
        }
        
    </style>

 <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNevbar">
                <ul class="navbar-nav">
                    <li class="navbar-item">
                    <a class="navbar-link" href="#">Homepage</a>
                    </li>
                    <li class="navbar-item">
                    <a class="navbar-link" href="#">Contact Us</a>
                    </li>
                    <li class="navbar-item">
                        <a class="navbar-link" href="#">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav> 
    <form>
        <label>First Name</label>
        <input type="text" id="fname" placeholder="Jane"><br>
        <label>Last Name</label>
        <input type="text" id="fname" placeholder="Doe"><br>
    <div class="grid-3">
        <div class="field">
            <label for="birthdate">Birth Date</label>
            <input id="birthdate" type="date" />
            </div>


        <label>Grade Level</label><br>
        <select>
            <option value="Junior Casa">Junior Casa</option>
            <option value="Junior Advanced Casa">Junior Advanced Casa</option>
            <option value="Advanced Casa">Advanced Casa</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <p>
            </select>
            <br>
        <label>Gender:</label>
        <br>
        <select>
         <option value="Female">Female</option>
            <option value="Male">Male</option>
        </select>
    
        <h2 class="section-title">Contact Details</h2>
         <div class="field"></div>
            <label>Email Address</label>
        <input type="text" id="email" placeholder="Obstudent.26@gmail.com"><br>
        </div>
        <h2 class="section-title">Other Information</h2>
    <div class="field">
      <label>Mode of Learning</label>
      <label><input type="radio" name="mode" value="online" /> Online</label>
      <label><input type="radio" name="mode" value="f2f" /> Face-to-Face</label>
    </div>

    <div class="field">
      <label>
        <input type="checkbox" required />
        I confirm that the information provided is true and complete.
      </label>
    </div>

    <div class="btn-wrap">
      <button type="submit" class="btn-submit">Submit Enrollment</button>
    </div>
  </form>
</body>
</html>
